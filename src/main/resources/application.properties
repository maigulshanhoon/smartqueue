spring.application.name=smartqueue

# Server configuration (Render dynamically sets PORT; defaults to 8080 locally)
server.port=${PORT:8080}

# Database configuration:
# Uses MySQL whenever DB_URL, DB_USERNAME, and DB_PASSWORD are provided.
# Safely falls back to an in-memory H2 database for demo mode when MySQL environment variables are absent.
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartqueuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
